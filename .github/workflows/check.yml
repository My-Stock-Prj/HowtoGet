name: PY & Parquet Checker

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: '구글시트(dpq)로 전송할 Parquet 파일명'
        required: true
        default: 'raw_daily_PQ.parquet'

jobs:
  inspect-and-sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # 패키지 설치 속도 향상

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. PY 데이터 체크 (기존 check_mst.py -> check_PY.py)
      - name: Run PY Data Checker
        run: |
          if [ -f "check_PY.py" ]; then
            python check_PY.py
          else
            echo "⚠️ 알림: check_PY.py 파일을 찾을 수 없어 건너뜁니다."
          fi

      # 5. Parquet 데이터 시트 전송 (Tool 2 실행)
      - name: Sync Parquet to Google Sheets (dpq)
        run: |
          if [ -f "check_parquet.py" ]; then
            # 사용자가 입력한 target_file 인자를 전달
            python check_parquet.py --file ${{ github.event.inputs.target_file }}
          else
            echo "❌ 에러: check_parquet.py 파일을 찾을 수 없습니다."
            exit 1
          fi
        env:
          # 환경변수 설정
          DATA_BASE_DIR: './DB'
          # kis_auth.py의 get_gcp_creds()가 사용하는 환경 변수명으로 매핑
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
