# 이 코드는 raw_ETF_run.yml
# -*- coding: utf-8 -*-
name: raw_daily_ETF

on:
  # 1. 수동 실행 허용
  workflow_dispatch:

  # 2. 매일 한국시간 새벽 1시 실행 (UTC 16:00)
  schedule:
    - cron: '0 16 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pykrx pandas tqdm pyarrow

      - name: Run ETF Collector
        run: python build_raw_ETF.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DB/raw_daily_ETF.parquet
          git commit -m "data: 누적 ETF PDF 데이터 업데이트 $(date +'%Y-%m-%d')" || exit 0
          git push
