name: KOSDAQ MST Data Checker

# 1. 실행 조건 설정
on:
  workflow_dispatch: # Actions 탭에서 수동으로 'Run workflow' 버튼을 눌러 실행
  # schedule:
  #   - cron: '0 0 * * *' # 매일 자정에 자동으로 실행하고 싶을 때 주석 해제

jobs:
  inspect-mst:
    runs-on: ubuntu-latest

    steps:
      # 2. 코드 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 3. 파이썬 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 4. MST 체크 스크립트 실행
      - name: Run MST Field Checker
        run: |
          # 파일이 존재하는지 확인 후 실행
          if [ -f "check_mst.py" ]; then
            python check_mst.py
          else
            echo "❌ 에러: check_mst.py 파일을 찾을 수 없습니다."
            exit 1
          fi

      # (선택 사항) 결과를 아티팩트로 저장하고 싶을 때
      # - name: Upload Results
      #   uses: actions/upload-artifact@v4
