name: KRX Raw Master

on:
  schedule:
    # 한국 시간(KST) 오전 08:30 실행 (UTC 23:30)
    # - cron: '30 23 * * *'
  workflow_dispatch: # 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # 이제 정상적으로 작동합니다.

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 파일이 있는지 확인 후 requirements.txt로 설치
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build RAW Master Parquet
        # 생성하신 파이썬 파일명이 build_raw_master.py라고 가정합니다.
        run: python build_raw_master.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add DB/raw_mst_krx_full.parquet
          git commit -m "Update RAW Master DB: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
